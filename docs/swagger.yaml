basePath: /
definitions:
  handler.createUserRequest:
    properties:
      display_name:
        example: Test User
        type: string
      email:
        example: testuser001@example.com
        type: string
      password:
        example: my_SECURE_password123@
        minLength: 8
        type: string
      username:
        example: testuser001
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  handler.createUserResponse:
    properties:
      data:
        $ref: '#/definitions/model.User'
      message:
        type: string
    type: object
  handler.healthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  handler.loginRequest:
    properties:
      password:
        example: my_SECURE_password123@
        minLength: 8
        type: string
      username:
        example: testuser001
        type: string
    required:
    - password
    - username
    type: object
  handler.loginResponse:
    properties:
      data:
        type: string
      message:
        type: string
    type: object
  handler.shortenURLRequest:
    properties:
      exp:
        maximum: 604800
        type: integer
      url:
        type: string
    required:
    - exp
    - url
    type: object
  handler.shortenURLResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  handler.updateProfileRequest:
    properties:
      display_name:
        example: Updated User 001
        type: string
      email:
        example: updatedtestuser001@example.com
        type: string
    required:
    - display_name
    - email
    type: object
  model.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  response.Message:
    properties:
      details: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API documentation for the Bookmark Management service.
  title: Bookmark Management API
  version: "1.2"
paths:
  /health-check:
    get:
      description: Performs a health check and returns the service status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.healthCheckResponse'
      summary: Health Check
      tags:
      - health
  /v1/generate-password:
    get:
      description: Generates a cryptographically secure random password of fixed length.
      produces:
      - text/plain
      responses:
        "200":
          description: w7h3Q9FeXskn
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Generate a random password
      tags:
      - password
  /v1/links/redirect/{code}:
    get:
      consumes:
      - application/json
      description: Retrieves the original URL from a given shortened code.
      parameters:
      - description: Shortened code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
      summary: Get original URL
      tags:
      - URL
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Shortens a given URL and returns a unique code.
      parameters:
      - description: URL to shorten
        in: body
        name: shortenURLRequest
        required: true
        schema:
          $ref: '#/definitions/handler.shortenURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.shortenURLResponse'
      summary: Shorten a URL
      tags:
      - URL
  /v1/self/info:
    get:
      description: Retrieve the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.createUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - Bearer: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update the profile of the authenticated user
      parameters:
      - description: Updated user profile
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/handler.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - Bearer: []
      summary: Update user profile
      tags:
      - Users
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      summary: User login
      tags:
      - Users
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user with the provided information
      parameters:
      - description: User to create
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.createUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      summary: Create a new user
      tags:
      - Users
schemes:
- http
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
